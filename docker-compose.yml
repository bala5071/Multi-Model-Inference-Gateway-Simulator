# docker compose up --build
#
# The demo: the gateway in simulated live mode, with its dashboard, on
#   http://localhost:8000/dashboard/
#
# No model runs. A seeded load is replayed on simulated time, and every number the
# dashboard shows is simulated on the calibrated model profiles, with placeholder prices:
# nothing here is a measurement. See docs/18-demo.md and docs/17-playground-load-replay.md.
#
# Secrets never go in this file or in the image. The plain server reads its pepper and its
# database path from gateway.env (git-ignored; copy gateway.env.example and fill it in), and
# keeps its database on the gateway-data volume. See docs/21-persistence.md.
services:
  gateway:
    build: .
    ports:
      # This machine only. Monitoring and load control are not authenticated; do not publish
      # on other interfaces (docs/platform-plan.md, section 9).
      - "127.0.0.1:8000:8000"
    # GATEWAY_KEY_PEPPER, GATEWAY_DATABASE and the retention, for the plain server. Optional
    # so that the demo, which keeps everything in memory, runs without it.
    env_file:
      - path: gateway.env
        required: false
    environment:
      # Requests from the host reach the container from the Docker bridge network, which the
      # gateway's local-only endpoints (monitoring, load control, the dashboard) then count
      # as local. That is only true because the port is published on 127.0.0.1 above: this
      # setting trusts that binding (docs/25-local-only.md).
      GATEWAY_LOCAL_NETWORKS: "172.16.0.0/12"

      GATEWAY_SIMULATED_LIVE: "1"
      # Simulated seconds per real second: 1, 5 or 20. The dashboard can change it.
      GATEWAY_SIM_SPEED: "5"
      # The load started with the server: steady, burst, overload or long-prompts.
      GATEWAY_SIM_PRESET: steady
      GATEWAY_SEED: "7"

      # A plain simulator server instead (wall-clock time, applications and API keys in the
      # database on the volume): remove the four lines above and create gateway.env. Then
      # issue keys inside the container:
      #   docker compose exec gateway /app/.venv/bin/python scripts/manage.py seed-demo
      #   docker compose exec gateway /app/.venv/bin/python scripts/manage.py \
      #       create-key --application acme --label me
      # Add the next line to let the dashboard start load; leave it out on anything others
      # can reach, since monitoring and load control are not authenticated.
      # GATEWAY_LOAD_CONTROL: "1"

      # Real models instead: as for the plain server, run the model servers on the host
      # (docs/12-real-models.md), mount a backends file whose URLs use
      # host.docker.internal instead of 127.0.0.1, and switch the two lines below on.
      # GATEWAY_BACKEND: llamacpp
      # GATEWAY_BACKENDS: /config/backends.yaml
    volumes:
      # Applications, key HMACs and usage (GATEWAY_DATABASE=/data/gateway.db in gateway.env).
      - gateway-data:/data
    #   - ./my-backends.yaml:/config/backends.yaml:ro
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"   # needed on Linux
    restart: unless-stopped

volumes:
  gateway-data:
