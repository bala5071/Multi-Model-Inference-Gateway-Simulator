name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

  # Fails the build if any model's simulated p99 total latency is over its budget in
  # benchmarks/budgets.json. See docs/08-ci-gate.md.
  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Performance gate
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/perf_gate.py --output perf-gate-results.json | tee perf-gate.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-results
          path: |
            perf-gate-results.json
            perf-gate.txt
          if-no-files-found: warn
