name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --locked

      # The usage store and migrations run on whatever SQLite this Python was built with.
      - name: SQLite version
        run: uv run python -c "import sqlite3; print('SQLite', sqlite3.sqlite_version)"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

  # The dashboard in frontend/: lint, formatting, types, component tests, and a build.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      - name: Build
        run: npm run build

  # Browser smoke tests of the built dashboard against the gateway in simulated live mode.
  # See docs/18-demo.md.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the gateway
        run: uv sync --locked

      - name: Install the dashboard
        working-directory: frontend
        run: npm ci

      - name: Install a browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: frontend/e2e/results
          if-no-files-found: ignore

  # Builds the image and checks that the compose demo comes up serving the dashboard.
  # The image cannot be built on the development machine; this job is where it is.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        run: docker compose up --build --detach

      - name: Wait for the gateway
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: The dashboard is served and the gateway is in simulated live mode
        run: |
          curl --silent --fail http://127.0.0.1:8000/dashboard/ | grep --quiet "Gateway monitor"
          curl --silent --fail http://127.0.0.1:8000/v1/control | grep --quiet '"active":true'

      - name: Stop
        if: always()
        run: docker compose down

  # Fails the build if any model's simulated p99 total latency is over its budget in
  # benchmarks/budgets.json. See docs/08-ci-gate.md.
  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Performance gate
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/perf_gate.py --output perf-gate-results.json | tee perf-gate.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-results
          path: |
            perf-gate-results.json
            perf-gate.txt
          if-no-files-found: warn
