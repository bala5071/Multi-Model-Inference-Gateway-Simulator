name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --locked

      # The usage store and migrations run on whatever SQLite this Python was built with.
      - name: SQLite version
        run: uv run python -c "import sqlite3; print('SQLite', sqlite3.sqlite_version)"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      # -ra lists every skipped test with its reason (it is also in pyproject's addopts); the
      # JUnit file records each test's outcome, to see which ran (e.g. the POSIX-only ones).
      - name: Pytest
        run: uv run pytest -ra --junitxml=junit-${{ matrix.python-version }}.xml

      - name: Report skipped tests
        if: always()
        shell: bash
        run: |
          uv run python - junit-${{ matrix.python-version }}.xml <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          suite = ET.parse(sys.argv[1]).getroot()
          cases = suite.iter("testcase")
          skipped = [
              f"{c.get('classname')}.{c.get('name')}" for c in cases if c.find("skipped") is not None
          ]
          totals = {k: suite.find("testsuite").get(k) for k in ("tests", "skipped", "failures", "errors")}
          print(totals)
          print("\n".join(skipped))
          names = ", ".join(s.rsplit(".", 1)[1] for s in skipped) or "none"
          print(f"::notice title=Skipped tests ({len(skipped)})::{names}")
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.python-version }}
          path: junit-${{ matrix.python-version }}.xml
          if-no-files-found: warn

  # The dashboard in frontend/: lint, formatting, types, component tests, and a build.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      - name: Build
        run: npm run build

  # Browser smoke tests of the built dashboard against the gateway in simulated live mode.
  # See docs/18-demo.md.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the gateway
        run: uv sync --locked

      - name: Install the dashboard
        working-directory: frontend
        run: npm ci

      - name: Install a browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: frontend/e2e/results
          if-no-files-found: ignore

  # Builds the image and checks that the compose demo comes up serving the dashboard.
  # The image cannot be built on the development machine; this job is where it is.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The local-only endpoints rely on the port being published on loopback only.
      - name: Compose publishes only on 127.0.0.1
        run: |
          docker compose config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          ports = [(name, p) for name, s in services.items() for p in s.get("ports", [])]
          assert ports, "no published ports"
          bad = [(n, p) for n, p in ports if p.get("host_ip") != "127.0.0.1"]
          print(ports)
          sys.exit(f"published beyond loopback: {bad}" if bad else 0)
          '

      - name: Build and start
        run: docker compose up --build --detach

      - name: Wait for the gateway
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: The running service is published on 127.0.0.1 only
        run: |
          published=$(docker compose port gateway 8000)
          echo "$published"
          case "$published" in 127.0.0.1:*) ;; *) echo "not loopback: $published"; exit 1;; esac

      - name: The dashboard is served and the gateway is in simulated live mode
        run: |
          curl --silent --fail http://127.0.0.1:8000/dashboard/ | grep --quiet "Gateway monitor"
          curl --silent --fail http://127.0.0.1:8000/v1/control | grep --quiet '"active":true'

      - name: Stop
        if: always()
        run: docker compose down

  # Runs the README's quickstart exactly as written (the shell blocks marked
  # <!-- quickstart -->): a throwaway pepper, the demo applications, a key, the server, one
  # request, a restart, and the usage read back. Fails if the README's commands stop working.
  readme-quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: README quickstart
        run: uv run python scripts/readme_quickstart.py

  # Fails the build if any protected output (docs/platform-plan.md, section 5) differs from
  # the cross-platform baseline in scripts/protected_outputs.sha256: the gate results, the
  # load generator's JSON, REPORT.md and the tracked benchmark data. The report's figures are
  # not in it (their pixels depend on the platform). Each differing file is also raised as an
  # annotation; the full output is an artifact.
  protected-outputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Protected outputs
        id: check
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/protected_outputs.py --keep protected-outputs \
            | tee protected-outputs.txt

      - name: Report differences
        if: always()
        shell: bash
        run: |
          echo "protected outputs check: ${{ steps.check.outcome }}"
          grep -E '^(changed|missing|new) ' protected-outputs.txt | while read -r line; do
            echo "::error title=Protected output differs::$line"
          done || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-outputs
          path: |
            protected-outputs.txt
            protected-outputs/
          if-no-files-found: warn

  # Fails the build if any model's simulated p99 total latency is over its budget in
  # benchmarks/budgets.json. See docs/08-ci-gate.md.
  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Performance gate
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/perf_gate.py --output perf-gate-results.json | tee perf-gate.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-results
          path: |
            perf-gate-results.json
            perf-gate.txt
          if-no-files-found: warn
