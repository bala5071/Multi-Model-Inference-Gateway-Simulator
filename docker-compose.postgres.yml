# Postgres for the durable-store tests (docs/36-postgres.md). Not the demo, which is
# docker-compose.yml.
#
#   docker compose -f docker-compose.postgres.yml up --detach --wait
#   GATEWAY_TEST_POSTGRES_URL=postgresql://postgres@127.0.0.1:5433/postgres uv run pytest -m postgres
#   docker compose -f docker-compose.postgres.yml down
#
# The image is pinned by digest; why this one is in docs/licenses.md. Published on this machine
# only, and it trusts every connection (no password: there is no secret to keep in this file),
# so never expose it. Its data lives on a tmpfs where the image declares its volume, so no data
# volume is created and nothing is left behind when it is removed.
services:
  postgres:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 20
